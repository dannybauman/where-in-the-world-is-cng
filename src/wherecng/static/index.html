<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where in the world is Cloud-Native Geospatial?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* palette from false-color satellite imagery: infrared magenta for life, water teal, survey ink */
:root {
  --ink: #142a33; --soft: #4d6470; --paper: #f2f5f3; --sheet: #ffffff; --line: #d3ddd9;
  --ir: #b8285e; --ir-ink: #ffffff; --ir-wash: #fbe9f0; --water: #1f7a8c; --good: #2e7d4f; --good-wash: #e7f3ec;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Lexend", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r-sm: 8px; --r-lg: 18px; --t-sm: .875rem; --t-md: 1.0625rem; --t-lg: 1.5rem; --t-xl: 2.25rem;
  --fade: 400ms;
}
@media (prefers-reduced-motion: reduce) { :root { --fade: 0ms; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font: 400 var(--t-md)/1.55 var(--body); color: var(--ink); background: var(--paper); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.skip { position: absolute; left: -999px; } .skip:focus { left: var(--s2); top: var(--s2); z-index: 9; background: var(--sheet); padding: var(--s2); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
p { margin: 0 0 var(--s3); }

.app { display: grid; grid-template-rows: 45vh 1fr; height: 100%; }
.map-wrap { position: relative; background: #cfdcd8; }
#map { position: absolute; inset: 0; }
.brand { position: absolute; left: var(--s3); top: var(--s3); z-index: 2; display: flex; gap: var(--s2); }
.brand button { border: 0; background: var(--sheet); border-radius: 999px; padding: var(--s2) var(--s4); min-height: 44px; box-shadow: 0 1px 4px rgba(20, 42, 51, .2); cursor: pointer; font-weight: 600; }
.brand .logo { font-family: var(--display); font-weight: 800; }
.flip { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 2; display: none; background: var(--sheet); border-radius: 999px; padding: var(--s1); box-shadow: 0 2px 10px rgba(20, 42, 51, .25); }
.flip.on { display: flex; }
.flip button { border: 0; background: none; border-radius: 999px; min-height: 44px; padding: 0 var(--s4); cursor: pointer; font-weight: 600; white-space: nowrap; }
.flip button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.maplibregl-ctrl-bottom-right { font-size: 11px; }

main { overflow: auto; background: var(--sheet); }
.panel { max-width: 34rem; margin: 0 auto; padding: var(--s5) var(--s4) var(--s6); }

.btn { min-height: 48px; padding: 0 var(--s5); border-radius: 999px; border: 2px solid var(--ir); background: var(--ir); color: var(--ir-ink); font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.quiet { background: none; color: var(--ir); }
.btn[disabled] { cursor: progress; opacity: .75; }
.row { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; margin-top: var(--s4); }

/* home */
.intro h1 { font-size: var(--t-xl); margin-bottom: var(--s3); }
.intro p { color: var(--soft); }
.case { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3); width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: var(--s4) 0; cursor: pointer; }
.case:hover:not([disabled]) h3 { color: var(--ir); }
.case[disabled] { cursor: default; opacity: .55; }
.case h3 { font-size: 1.25rem; }
.case .who { color: var(--water); font-weight: 600; font-size: var(--t-sm); }
.case p { grid-column: 1; color: var(--soft); margin: 0; }
.case .stars { grid-row: 1 / span 3; grid-column: 2; align-self: center; }
.stars { color: var(--ir); letter-spacing: .1em; font-size: 1.1rem; white-space: nowrap; }
.stars .off { color: var(--line); }

/* a step */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s2); }
.top .who { color: var(--water); font-weight: 600; font-size: var(--t-sm); }
.dots { display: flex; gap: 6px; margin-bottom: var(--s4); }
.dots i { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.dots i.done { background: var(--ir); }
.step h2 { font-size: var(--t-lg); margin-bottom: var(--s3); }
.options { display: grid; gap: var(--s2); margin-top: var(--s4); }
.opt { text-align: left; min-height: 52px; padding: var(--s3) var(--s4); border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--sheet); cursor: pointer; line-height: 1.4; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt[disabled] { cursor: default; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--paper); }
.opt small { display: block; color: var(--soft); font-size: var(--t-sm); margin-top: var(--s1); }
.opt.right { border-color: var(--good); background: var(--good-wash); }
.opt.wrong { border-color: var(--ir); background: var(--ir-wash); }
.say { padding: var(--s3) var(--s4); border-radius: var(--r-sm); background: var(--good-wash); margin-top: var(--s4); }
.say.wrong { background: var(--ir-wash); }
.wait { color: var(--soft); margin-top: var(--s4); }
.wait::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: var(--s2); border-radius: 50%; background: var(--water); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.6); } }
@media (prefers-reduced-motion: reduce) { .wait::before { animation: none; } }
.tapnote { margin-top: var(--s4); font-weight: 600; color: var(--water); }

/* a measurement: 2 bars on the same scale */
.measure { margin-top: var(--s4); }
.bar { display: grid; grid-template-columns: 7.5rem 1fr 3.5rem; gap: var(--s3); align-items: center; margin-bottom: var(--s2); font-size: var(--t-sm); }
.bar span:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.track { height: 14px; background: var(--paper); border-radius: 7px; overflow: hidden; }
.track b { display: block; height: 100%; border-radius: 7px; background: var(--water); }
.bar.after .track b { background: var(--ir); }
.list { margin: var(--s4) 0 0; padding: 0; list-style: none; }
.list li { padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border: 0; }

/* field notes */
.note { display: flex; gap: var(--s3); margin-top: var(--s4); padding: var(--s3) var(--s4); border-left: 4px solid var(--water); background: #eef5f6; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.note b { display: block; }
.note p { margin: 0; font-size: var(--t-sm); }

/* finish */
.end h2 { font-size: var(--t-xl); margin-bottom: var(--s2); }
.end .stars { font-size: 2rem; display: block; margin: var(--s3) 0 var(--s4); }
.file { white-space: pre-wrap; font-size: var(--t-sm); background: var(--paper); border-radius: var(--r-sm); padding: var(--s4); }

dialog { border: 0; border-radius: var(--r-lg); padding: 0; width: min(36rem, calc(100% - 24px)); }
dialog::backdrop { background: rgba(20, 42, 51, .5); }
.notebook { padding: var(--s5); max-height: 80vh; overflow: auto; }
.notebook h2 { margin-bottom: var(--s2); }
.term { padding: var(--s3) 0; border-top: 1px solid var(--line); }
.term h3 { font-size: 1.05rem; margin-bottom: var(--s1); }
.term p { margin: 0 0 var(--s1); }
.term a { color: var(--water); font-weight: 600; }
.term.locked { color: var(--soft); }
input[type=text] { min-height: 48px; padding: 0 var(--s4); border-radius: var(--r-sm); border: 2px solid var(--line); flex: 1; min-width: 12rem; }
input[type=text]:focus { border-color: var(--water); outline: none; }

@media (min-width: 900px) {
  .app { grid-template-columns: 1fr 30rem; grid-template-rows: 1fr; }
  main { border-left: 1px solid var(--line); }
  .panel { padding: var(--s6) var(--s5); }
}
</style>
</head>
<body>
<a class="skip" href="#panel">Skip to the game</a>
<div class="app">
  <div class="map-wrap" role="region" aria-label="Map">
    <div id="map"></div>
    <div class="brand">
      <button class="logo" id="home-btn" type="button">Where in the world is CNG?</button>
      <button id="nb-btn" type="button">Notebook <span id="nb-count">0</span>/9</button>
    </div>
    <div class="flip" id="flip" role="group" aria-label="Show picture">
      <button type="button" id="flip-a" aria-pressed="false">Before</button>
      <button type="button" id="flip-b" aria-pressed="true">After</button>
    </div>
  </div>
  <main id="panel" tabindex="-1"><div class="panel" id="view" aria-live="polite"></div></main>
</div>
<dialog id="nb"><div class="notebook" id="nb-body"></div></dialog>

<script>
// ---------- notebook: one idea per note, with the open project behind it ----------
const NOTES = {
  satellite: ["Satellites", "Sentinel-2 photographs every place on Earth about every 5 days. One pixel is 10 m, about a house. The pictures are free.", ["Sentinel-2", "https://sentinels.copernicus.eu/web/sentinel/missions/sentinel-2"]],
  stac: ["Searching for pictures", "STAC is a shared way to search satellite pictures by place and date, like a library catalog. Earth Search is a free one.", ["stacspec.org", "https://stacspec.org"]],
  clouds: ["Clouds", "Satellites can't see through clouds. Pick the clearest picture that covers your whole area.", null],
  fastmaps: ["Fast maps", "The files are huge, but they're stored so a map can read just the part on screen. TiTiler draws that part in seconds.", ["TiTiler", "https://developmentseed.org/titiler/"]],
  compare: ["Before and after", "To see change, compare the same place on 2 dates in the same season.", null],
  bands: ["Seeing beyond color", "Satellites also see infrared. Water, plants and burned ground each look very different there. Simple math on 2 colors makes an index you can measure.", ["Index database", "https://www.indexdatabase.de"]],
  groundtruth: ["Ground truth", "A satellite number is a clue. Check it against a measurement on the ground before you call it fact.", ["Lake Mead levels", "https://www.usbr.gov/lc/region/g4000/hourly/levels.html"]],
  feeds: ["Live feeds", "NASA EONET and GDACS list fires, storms and floods as they happen. Open-Meteo gives weather for any spot. No account needed.", ["NASA EONET", "https://eonet.gsfc.nasa.gov"]],
  honest: ["Honest claims", "Say what you found, how you know, and what you can't tell. People trust the claim that names its limits.", ["groundstation", "https://github.com/dannybauman/groundstation"]],
};
const save = JSON.parse(localStorage.getItem("gt2") || '{"notes":[],"stars":{}}');
const persist = () => localStorage.setItem("gt2", JSON.stringify(save));
const countNotes = () => (document.getElementById("nb-count").textContent = save.notes.length);
function note(key) {
  if (!save.notes.includes(key)) { save.notes.push(key); persist(); countNotes(); }
  const [t, body] = NOTES[key];
  return `<div class="note"><div><b>New note: ${t}</b><p>${body}</p></div></div>`;
}

// ---------- groundstation, through the console's routes ----------
async function api(path) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 90000);
  try {
    const r = await fetch(path, { signal: ctrl.signal });
    if (!r.ok) throw new Error("The data service didn't answer.");
    return await r.json();
  } catch (e) { throw new Error(e.name === "AbortError" ? "The data service is slow right now." : e.message); }
  finally { clearTimeout(t); }
}
const q = o => new URLSearchParams(o).toString();
// outside text (place names, alert titles) is escaped once, where it enters the game
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const box = b => ({ w: b[0], s: b[1], e: b[2], n: b[3] });
const search = (b, start, end, cloud = 20) => api(`/api/search?${q({ ...box(b), start, end, max_cloud: cloud })}`);
const stats = async (item, ex, b) => { const r = await api(`/api/stats?${q({ item, expression: ex, ...box(b) })}`); if (!r.stats) throw new Error("The measurement didn't come back."); return r.stats.mean; };
const tiles = async (item, ex) => (await api(`/api/tiles?${q(ex ? { item, expression: ex } : { item })}`)).tiles;
const n = (x, d = 2) => Number(x).toFixed(d);
const day = id => { const m = id.match(/_(\d{4})(\d{2})(\d{2})_/); return m ? new Date(`${m[1]}-${m[2]}-${m[3]}T12:00Z`).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : esc(id); };
const WATER = "(green-nir)/(green+nir)", BURN = "(nir-swir22)/(nir+swir22)";

// ---------- map ----------
const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [-40, 30], zoom: 1.3, attributionControl: { compact: true } });
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
const ready = new Promise(r => map.on("load", r));
const fade = () => (matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 400);
let caseBox = null;
async function frame(b) {
  caseBox = b;
  await ready;
  const ring = [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]], [b[0], b[1]]];
  const gj = { type: "Feature", geometry: { type: "Polygon", coordinates: [ring] } };
  if (map.getSource("box")) map.getSource("box").setData(gj);
  else { map.addSource("box", { type: "geojson", data: gj }); map.addLayer({ id: "box", type: "line", source: "box", paint: { "line-color": "#b8285e", "line-width": 3 } }); }
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 32, duration: fade() * 4 });
}
async function picture(slot, url) {
  await ready;
  const id = "pic-" + slot;
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
  // the free tile service draws only the case box, at zooms where a 10 m pixel can be seen; past 14 the map stretches tiles it has
  const pad = caseBox && Math.max(caseBox[2] - caseBox[0], caseBox[3] - caseBox[1]) * 0.5;
  map.addSource(id, { type: "raster", tiles: [url], tileSize: 256, minzoom: 8, maxzoom: 14, ...(caseBox && { bounds: [caseBox[0] - pad, caseBox[1] - pad, caseBox[2] + pad, caseBox[3] + pad] }), attribution: "Sentinel-2 via Earth Search, drawn by TiTiler" });
  map.addLayer({ id, type: "raster", source: id, paint: { "raster-opacity-transition": { duration: fade() } } }, map.getLayer("box") ? "box" : undefined);
}
function flip(labelA, labelB) {
  document.getElementById("flip-a").textContent = labelA;
  document.getElementById("flip-b").textContent = labelB;
  document.getElementById("flip").classList.add("on");
  show("b");
}
function show(slot) {
  if (map.getLayer("pic-b")) map.setPaintProperty("pic-b", "raster-opacity", slot === "b" ? 1 : 0);
  document.getElementById("flip-a").setAttribute("aria-pressed", slot === "a");
  document.getElementById("flip-b").setAttribute("aria-pressed", slot === "b");
}
document.getElementById("flip-a").onclick = () => show("a");
document.getElementById("flip-b").onclick = () => show("b");
let tapHandler = null, marker = null;
function resetMap() {
  for (const id of ["pic-a", "pic-b"]) { if (map.getLayer(id)) map.removeLayer(id); if (map.getSource(id)) map.removeSource(id); }
  if (tapHandler) { map.off("click", tapHandler); tapHandler = null; }
  marker?.remove(); marker = null;
  if (map.getLayer("box")) { map.removeLayer("box"); map.removeSource("box"); }
  map.getCanvas().style.cursor = "";
  document.getElementById("flip").classList.remove("on");
}

// ---------- the step engine ----------
// a step is (ctx) => { title, text, and one of: go (a button that fetches), pick (a choice), guess, tap (on the map), ask (a text box) }
const view = document.getElementById("view");
const el = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
let run = null;

function render() {
  const { c, i, ctx } = run, s = c.steps[i](ctx);
  view.innerHTML = `<div class="top"><span class="who">${c.who}: ${c.title}</span></div>
    <div class="dots" aria-label="Step ${i + 1} of ${c.steps.length}">${c.steps.map((_, k) => `<i class="${k < i ? "done" : ""}"></i>`).join("")}</div>
    <div class="step"><h2>${s.title}</h2>${s.text || ""}<div id="body"></div><div class="row" id="ctl"></div></div>`;
  const body = document.getElementById("body"), ctl = document.getElementById("ctl");
  const next = () => {
    const last = i + 1 >= c.steps.length;
    const b = el(`<button class="btn" type="button">${last ? "Close the case" : "Next"}</button>`);
    b.onclick = () => { run.i++; last ? finish() : render(); };
    ctl.replaceChildren(b); b.focus({ preventScroll: true });
  };
  const doing = async (btn, fn, waitText) => {
    btn.disabled = true; btn.hidden = true;
    body.innerHTML = `<p class="wait" role="status">${waitText || "Asking the satellite archive…"}</p>`;
    try { body.innerHTML = await fn(); next(); return true; }
    catch (e) { body.innerHTML = `<div class="say wrong" role="alert">${esc(e.message)} Try again in a moment.</div>`; btn.disabled = false; btn.hidden = false; btn.textContent = "Try again"; return false; }
  };
  if (s.go) {
    const b = el(`<button class="btn" type="button">${s.go.label}</button>`);
    b.onclick = () => doing(b, () => s.go.run(ctx), s.go.wait);
    ctl.replaceChildren(b);
  } else if (s.ask) {
    const inp = el(`<input type="text" aria-label="${s.ask.label}" placeholder="${s.ask.placeholder}">`);
    const b = el(`<button class="btn" type="button">${s.ask.button}</button>`);
    const go = () => inp.value.trim() ? doing(b, () => s.ask.run(inp.value.trim(), ctx), s.ask.wait) : inp.focus();
    // an on* handler that returns false cancels the event, so `e.key === "Enter" && go()`
    // returned false for every other key and threw away each letter typed
    b.onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
    ctl.replaceChildren(inp, b); inp.focus({ preventScroll: true });
  } else if (s.pick || s.guess) {
    const p = s.pick || s.guess;
    const opts = el(`<div class="options" role="group" aria-label="Answers"></div>`);
    p.options.forEach((o, k) => {
      const b = el(`<button class="opt" type="button">${o.text}</button>`);
      b.onclick = async () => {
        [...opts.children].forEach(x => (x.disabled = true));
        if (s.guess) { b.classList.add("right"); ctx.guess = o.key; body.innerHTML = `<div class="say">Noted. Let's find out.</div>`; return next(); }
        b.classList.add(o.right ? "right" : "wrong");
        if (!o.right) opts.children[p.options.findIndex(x => x.right)].classList.add("right");
        if (o.right) star();
        body.innerHTML = `<div class="say ${o.right ? "" : "wrong"}">${o.right ? "Good call. " : "Not quite. "}${o.why}</div>${p.then ? await p.then(ctx) : ""}`;
        next();
      };
      opts.appendChild(b);
    });
    body.before(opts);
  } else if (s.look) {
    // every choice must be answerable from what's on screen: tap to preview each picture, then commit
    const opts = el(`<div class="options" role="group" aria-label="Pictures"></div>`);
    const use = el(`<button class="btn" type="button" disabled>Use this picture</button>`);
    let chosen = null;
    s.look.options.forEach(o => {
      const b = el(`<button class="opt" type="button" aria-pressed="false">${o.text}</button>`);
      b.onclick = async () => {
        [...opts.children].forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true"); chosen = o; use.disabled = false;
        try { await s.look.preview(o); } catch { body.innerHTML = `<p class="wait">That picture didn't load. Try another.</p>`; }
      };
      opts.appendChild(b);
    });
    use.onclick = async () => {
      [...opts.children].forEach((x, k) => {
        const o = s.look.options[k];
        x.disabled = true; x.classList.add(o.right ? "right" : x === opts.children[s.look.options.indexOf(chosen)] ? "wrong" : "plain");
        x.insertAdjacentHTML("beforeend", `<small>${o.reveal}</small>`);
      });
      if (chosen.right) star();
      use.hidden = true;
      body.innerHTML = `<div class="say ${chosen.right ? "" : "wrong"}">${chosen.right ? "Good eye. " : "Not quite. "}${chosen.why}</div>${await s.look.then(ctx, chosen)}`;
      next();
    };
    body.innerHTML = `<p class="tapnote">${s.look.hint}</p>`;
    body.before(opts); ctl.replaceChildren(use);
  } else if (s.flipTask) {
    body.innerHTML = `<p class="tapnote">${s.flipTask}</p>`;
    const mine = run, at = i;
    document.getElementById("flip-a").addEventListener("click", () => {
      if (run !== mine || run.i !== at) return;
      star(); body.innerHTML = `<div class="say">That's the switch. Tap "From space" to come back. You'll use it in every case.</div>`; next();
    }, { once: true });
  } else if (s.tap) {
    body.innerHTML = `<p class="tapnote">Tap the map to choose a spot.</p>`;
    map.getCanvas().style.cursor = "crosshair";
    const onTap = async e => {
      map.off("click", onTap); tapHandler = null; map.getCanvas().style.cursor = "";
      marker?.remove(); marker = new maplibregl.Marker({ color: "#142a33" }).setLngLat(e.lngLat).addTo(map);
      const { lng, lat } = e.lngLat;
      const ok = await doing({}, () => s.tap.run([lng - .004, lat - .003, lng + .004, lat + .003], ctx), "Measuring that spot…");
      if (!ok) { body.insertAdjacentHTML("beforeend", `<p class="tapnote">Tap the map to try again.</p>`); arm(); }
    };
    const arm = () => { tapHandler = onTap; map.getCanvas().style.cursor = "crosshair"; map.on("click", onTap); };
    arm();
  } else next();
  document.getElementById("panel").scrollTop = 0;
}
function star() { run.ctx.stars = (run.ctx.stars || 0) + 1; }
const starRow = (got, of) => `<span class="stars" aria-label="${got} of ${of} stars">${"★".repeat(got)}<span class="off">${"★".repeat(of - got)}</span></span>`;
function start(c) {
  resetMap(); run = { c, i: 0, ctx: { stars: 0 } }; render();
  const panel = document.getElementById("panel");
  if (!panel.contains(document.activeElement) || document.activeElement === panel) panel.focus({ preventScroll: true });
}
function finish() {
  const { c, ctx } = run, got = ctx.stars;
  save.stars[c.id] = Math.max(save.stars[c.id] || 0, got); persist();
  const file = c.file(ctx);
  view.innerHTML = `<div class="end"><span class="who" style="color:var(--water);font-weight:700">${c.who}: ${c.title}</span>
    <h2>Case closed</h2>${starRow(got, c.maxStars)}
    <p>Your case file. Anyone with the same open data can check it.</p><div class="file">${file}</div>
    <div class="row"><button class="btn" id="copy" type="button">Copy case file</button><button class="btn quiet" id="back" type="button">More cases</button></div></div>`;
  document.getElementById("copy").onclick = async e => { await navigator.clipboard.writeText(document.querySelector(".file").innerText); e.target.textContent = "Copied"; };
  document.getElementById("back").onclick = home;
  document.getElementById("back").focus({ preventScroll: true });
}

// ---------- shared moves ----------
async function best(b, from, to, cloud = 20) {
  const r = await search(b, from, to, cloud);
  if (!r.items?.length) throw new Error(`No clear pictures between ${from} and ${to}.`);
  return r.items;
}
function bars(name, a, b, la, lb) {
  const w = v => Math.max(2, Math.min(100, ((v + 1) / 2) * 100));
  return `<div class="measure" aria-label="${name}">
    <div class="bar"><span>${la}</span><div class="track"><b style="width:${w(a)}%"></b></div><span>${n(a)}</span></div>
    <div class="bar after"><span>${lb}</span><div class="track"><b style="width:${w(b)}%"></b></div><span>${n(b)}</span></div></div>`;
}
const cover = it => `${n(it.cloud_cover, 0)}% cloud, shows ${n(it.covers_aoi_pct, 0)}% of the lake`;

// ---------- the cases ----------
const MEAD = [-114.85, 36.0, -114.35, 36.4];
const GORGE = [-122.05, 45.55, -121.75, 45.72];
const CASES = [
  {
    id: "first", who: "Explorer", title: "First Look", maxStars: 1,
    blurb: "See a place you know from space, and learn the map. Takes 2 minutes.",
    steps: [
      ctx => ({ title: "Pick a place you know", text: `<p>Your town, a park, a landmark. You'll see it the way a satellite does.</p>`,
        ask: { label: "Place name", placeholder: "e.g. Golden Gate Bridge", button: "Go", wait: "Finding it…", run: async name => {
          const g = await api(`/api/geocode?${q({ q: name })}`);
          if (!g.bbox) throw new Error(`Couldn't find "${esc(name)}". Try adding a state or country.`);
          // a big place (a state, a country) gets a box about 30 km wide at its middle, the size one picture shows well
          let [w, s, e, nn] = g.bbox;
          const cx = (w + e) / 2, cy = (s + nn) / 2, half = Math.min(0.15, Math.max(e - w, nn - s) * 0.65 + 0.02);
          Object.assign(ctx, { box: [cx - half, cy - half, cx + half, cy + half], full: esc(g.name) });
          await frame(ctx.box);
          return `<p>Found ${ctx.full}.</p>`;
        } } }),
      ctx => ({ title: "See it from space", text: `<p>Get the newest clear picture of this place.</p>`,
        go: { label: "Get the picture", run: async () => {
          const iso = d => d.toISOString().slice(0, 10), to = new Date();
          let items = [];
          for (const days of [60, 365]) { try { items = await best(ctx.box, iso(new Date(to - days * 864e5)), iso(to), 20); break; } catch {} }
          if (!items.length) throw new Error("It's been too cloudy there. Go back and try another place.");
          const it = items.sort((x, y) => y.datetime.localeCompare(x.datetime))[0];
          ctx.scene = day(it.id);
          await picture("b", await tiles(it.id)); flip("Map", "From space");
          return `<p>Taken ${ctx.scene}.</p>${note("satellite")}`;
        } } }),
      () => ({ title: "Meet the switch", text: `<p>The switch at the bottom of the map flips between views. You'll use it to compare pictures.</p>`,
        flipTask: `Tap "Map" on the switch.` }),
      () => ({ title: "Look around", text: `<p>Drag to move. Pinch, scroll or use + and − to zoom.</p><p>Each pixel is about the size of a house, so you can spot fields, roads and big buildings, but not cars.</p>` }),
    ],
    file: c => `Place: ${c.full}\nPicture: Sentinel-2, taken ${c.scene}. Free and open.`,
  },
  {
    id: "lake", who: "Detective", title: "The Vanishing Lake", maxStars: 2,
    blurb: "A post says Lake Mead shrank a lot this year. Find out if it's true.",
    steps: [
      () => ({ title: "A post is going viral", text: `<p>It says Lake Mead, the biggest reservoir in the US, shrank a lot in the past year. Your editor asks: true?</p><p>You can't fly to Nevada. But satellites photograph the lake every few days, so you'll check.</p>${note("satellite")}` }),
      ctx => ({ title: "Find last summer's pictures", text: `<p>Search the archive for pictures of the lake from summer 2025.</p>`,
        go: { label: "Search summer 2025", run: async () => {
          await frame(MEAD);
          const all = await best(MEAD, "2025-07-01", "2025-08-31", 90);
          const good = all.find(i => i.cloud_cover < 10 && i.covers_aoi_pct >= 70);
          if (!good) throw new Error("No clear picture of the whole lake that summer.");
          const part = all.find(i => i.cloud_cover < 20 && i.covers_aoi_pct < 50);
          const cloudy = all.find(i => i.cloud_cover >= 40);
          ctx.good = good; ctx.list = [part, good, cloudy].filter(Boolean);
          return `<p>Found ${all.length} pictures. Here are ${ctx.list.length} of them.</p>${note("stac")}`;
        } } }),
      ctx => ({ title: "Which picture is the best evidence?", text: `<p>Tap each picture to see it on the map. Look for clouds, and for parts of the lake that are missing.</p>`,
        look: {
          hint: "Pick the one you trust most.",
          options: ctx.list.map((it, k) => ({ it, text: `Picture ${k + 1}, ${day(it.id)}`, right: it === ctx.good,
            reveal: `${n(it.cloud_cover, 0)}% cloud, shows ${n(it.covers_aoi_pct, 0)}% of the lake`,
            why: it === ctx.good ? "No clouds, and it shows most of the lake." : it.cloud_cover >= 40 ? "Clouds hide the water. You can't measure what you can't see." : "It's clear, but it misses part of the lake. Half a lake is half the evidence." })),
          preview: async o => picture("a", await tiles(o.it.id)),
          then: async () => { ctx.a = ctx.good; await picture("a", await tiles(ctx.good.id)); return `${note("clouds")}${note("fastmaps")}`; },
        } }),
      ctx => ({ title: "Now this summer", text: `<p>Get the same place, same season, one year later.</p>`,
        go: { label: "Search summer 2026", run: async () => {
          ctx.b = (await best(MEAD, "2026-07-01", "2026-08-31"))[0];
          await picture("b", await tiles(ctx.b.id));
          flip(day(ctx.a.id), day(ctx.b.id));
          return `<p>Use the switch on the map to flip between the 2 years.</p>${note("compare")}`;
        } } }),
      () => ({ title: "Your hunch?", text: `<p>Flip between the years a few times. Compared to last year, the lake has…</p>`,
        guess: { options: [{ key: "less", text: "Much less water" }, { key: "same", text: "About the same" }, { key: "more", text: "More water" }] } }),
      ctx => ({ title: "Measure it", text: `<p>Eyes can fool you. Water looks dark in infrared, so a water score over every pixel tells you how much water is in the frame.</p>`,
        go: { label: "Measure the water", wait: "Measuring every pixel…", run: async () => {
          const [a, b] = await Promise.all([stats(ctx.a.id, WATER, MEAD), stats(ctx.b.id, WATER, MEAD)]);
          ctx.ma = a; ctx.mb = b;
          const d = b - a; ctx.verdict = d < -0.03 ? "less" : d > 0.03 ? "more" : "same";
          const right = ctx.guess === ctx.verdict; if (right) star();
          const said = { less: "There's clearly less water.", same: "Barely any change. The post doesn't hold up.", more: "There's more water, not less." }[ctx.verdict];
          return `${bars("Water score", a, b, day(ctx.a.id), day(ctx.b.id))}<div class="say ${right ? "" : "wrong"}">${said} ${right ? "Your hunch was right." : "Not what you guessed, which is why we measure."}</div>${note("bands")}${note("groundtruth")}`;
        } } }),
    ],
    file: c => `Claim: Lake Mead shrank a lot in the past year.\nFinding: ${{ less: "True, there is less water.", same: "Not supported. Little change.", more: "False, there is more water." }[c.verdict]}\nEvidence: Sentinel-2 pictures from ${day(c.a.id)} and ${day(c.b.id)}. Water score went from ${n(c.ma)} to ${n(c.mb)}.\nLimits: one area, 2 days. Check the official lake level before publishing.`,
  },
  {
    id: "fire", who: "Responder", title: "After the Fire", maxStars: 3,
    blurb: "A 2017 wildfire burned in Oregon's Columbia River Gorge. Find where, and send crews.",
    steps: [
      ctx => ({ title: "The gorge is burning", text: `<p>September 2017. A wildfire burns for weeks in the Columbia River Gorge. You lead recovery: where did it burn, and how badly?</p><p>Start with a picture from just before the fire and one from just after.</p>`,
        go: { label: "Get before and after", run: async () => {
          await frame(GORGE);
          const [a, b] = await Promise.all([best(GORGE, "2017-08-20", "2017-08-31", 10), best(GORGE, "2017-10-01", "2017-10-10", 10)]);
          ctx.a = a[0]; ctx.b = b[0];
          await picture("a", await tiles(ctx.a.id)); await picture("b", await tiles(ctx.b.id));
          flip(`Before: ${day(ctx.a.id)}`, `After: ${day(ctx.b.id)}`);
          return `<p>Flip between them with the switch on the map.</p>${note("compare")}`;
        } } }),
      () => ({ title: "Hard to see, right?", text: `<p>Autumn colors, shadows and haze all look brown. How could you see the burn more clearly?</p>`,
        pick: { options: [
          { text: "Zoom in closer", right: false, why: "More zoom just shows more brown." },
          { text: "Look in infrared", right: true, why: "Healthy plants glow in infrared. Burned ground doesn't." },
          { text: "Wait for the trees to grow back", right: false, why: "Crews need the answer now." },
        ], then: async () => note("bands") } }),
      ctx => ({ title: "Switch to infrared", text: `<p>Repaint both pictures with a burn score. Green is healthy. Red is burned.</p>`,
        go: { label: "Show the burn score", run: async () => {
          await picture("a", await tiles(ctx.a.id, BURN)); await picture("b", await tiles(ctx.b.id, BURN));
          flip(`Before: ${day(ctx.a.id)}`, `After: ${day(ctx.b.id)}`);
          return `<p>Flip again. The burn jumps out.</p>`;
        } } }),
      ctx => ({ title: "Send the first crew", text: `<p>Tap where you'd send the first crew: the worst-burned spot you can see. Red is burned.</p>`,
        tap: { run: async (spot) => {
          const [a, b] = await Promise.all([stats(ctx.a.id, BURN, spot), stats(ctx.b.id, BURN, spot)]);
          const burned = b < 0.3 && a - b > 0.15; if (burned) star();
          return `${bars("Burn score at your spot", a, b, "Before", "After")}<div class="say ${burned ? "" : "wrong"}">${burned ? "Good call. That spot burned hard." : "That spot looks mostly unburned. Look for deep red south of the river."}</div>`;
        } } }),
      ctx => ({ title: "Measure the whole area", text: `<p>Now one number for the report: the burn score over the whole box.</p>`,
        go: { label: "Measure the area", wait: "Measuring every pixel…", run: async () => {
          const [a, b] = await Promise.all([stats(ctx.a.id, BURN, GORGE), stats(ctx.b.id, BURN, GORGE)]);
          ctx.ma = a; ctx.mb = b; ctx.drop = Math.round(((a - b) / a) * 100);
          return `${bars("Burn score", a, b, "Before", "After")}<p>Down ${ctx.drop}% across the area.</p>`;
        } } }),
      ctx => ({ title: "Brief the public", text: `<p>Which line do you hand your chief?</p>`,
        pick: { options: [
          { text: "The whole gorge was destroyed.", right: false, why: "The map shows patches, not everything. Overclaiming costs trust." },
          { text: `Satellite data shows a ${ctx.drop}% drop in plant health across the area, mostly south of the river. Crews will confirm.`, right: true, why: "What you found, how you know, and what's still unsure." },
          { text: "The fire caused flooding.", right: false, why: "Nothing you measured is about flooding." },
        ], then: async () => note("honest") } }),
    ],
    file: c => `Question: Where did the 2017 Eagle Creek fire burn?\nFinding: Burn score fell ${c.drop}% across the area (${n(c.ma)} to ${n(c.mb)}), mostly south of the river.\nEvidence: Sentinel-2 pictures from ${day(c.a.id)} and ${day(c.b.id)}.\nLimits: a score, not a damage survey. Crews confirm on the ground.`,
  },
  {
    id: "news", who: "Reporter", title: "Right Now, Near You", maxStars: 1,
    blurb: "Pick any place. Find out what's happening there today, and write a headline.",
    steps: [
      ctx => ({ title: "Pick a place", text: `<p>Readers ask: is anything going on near us? Choose a town, lake, mountain or park.</p>`,
        ask: { label: "Place name", placeholder: "e.g. Portland, Oregon", button: "Go", wait: "Finding it…", run: async name => {
          const g = await api(`/api/geocode?${q({ q: name })}`);
          if (!g.bbox) throw new Error(`Couldn't find "${esc(name)}". Try adding a state or country.`);
          const [w, s, e, nn] = g.bbox, pad = Math.max(0.05, (e - w) * 0.1);
          Object.assign(ctx, { box: [w - pad, s - pad, e + pad, nn + pad], name: esc(g.name.split(",")[0]), full: esc(g.name), lat: g.lat, lon: g.lon });
          await frame(ctx.box);
          return `<p>Found ${ctx.full}.</p>`;
        } } }),
      ctx => ({ title: "Check the live feeds", text: `<p>Fires, storms and floods from the last 30 days, plus this week's weather.</p>`,
        go: { label: "Check the feeds", run: async () => {
          const [ev, w] = await Promise.all([api(`/api/events?${q({ ...box(ctx.box), days: 30 })}`), api(`/api/weather?${q({ lat: ctx.lat, lon: ctx.lon })}`)]);
          ctx.events = [...(ev.eonet || []), ...(ev.gdacs || [])].map(x => esc(x.title || x.name || "event")).slice(0, 4);
          ctx.feedsOk = Object.values(ev.sources || {}).every(s => s.ok);
          const d = w.daily, today = new Date().toISOString().slice(0, 10), k = Math.max(0, d.time.indexOf(today));
          ctx.rain = d.precipitation_sum.slice(0, k).reduce((a, b) => a + (b || 0), 0); ctx.high = d.temperature_2m_max[k];
          const evs = ctx.events.length ? ctx.events.map(t => `<li>${t}</li>`).join("") : `<li>No fires, storms or floods listed${ctx.feedsOk ? "" : " (one feed didn't answer)"}</li>`;
          return `<ul class="list">${evs}<li>${n(ctx.rain, 0)} mm of rain this past week</li><li>High of ${n(ctx.high, 0)} °C today</li></ul>${note("feeds")}`;
        } } }),
      ctx => ({ title: "The latest view from space", text: `<p>Get the newest clear picture from the last 45 days.</p>`,
        go: { label: "Get the picture", run: async () => {
          const to = new Date(), from = new Date(to - 45 * 864e5), iso = d => d.toISOString().slice(0, 10);
          try {
            const it = (await best(ctx.box, iso(from), iso(to), 30)).sort((x, y) => y.datetime.localeCompare(x.datetime))[0];
            ctx.scene = day(it.id); await picture("a", await tiles(it.id));
            return `<p>From ${ctx.scene}, ${n(it.cloud_cover, 0)}% cloud.</p>`;
          } catch { ctx.scene = null; return `<p>Too cloudy: no clear picture in 45 days. That's worth saying too.</p>`; }
        } } }),
      ctx => {
        const k = ctx.events.length;
        const fact = k ? `${k} natural event${k > 1 ? "s" : ""} listed near ${ctx.name} this month` : `No disaster alerts near ${ctx.name} this month`;
        return { title: "Write the headline", text: `<p>Pick the one you'd put your name on.</p>`, pick: { options: [
          { text: k ? `${ctx.name} in danger as disasters strike` : `${ctx.name} is totally safe, experts say`, right: false, why: k ? "\"In danger\" isn't in the data." : "An empty feed isn't proof of safety, and no expert said it." },
          { text: `${fact}, per NASA and GDACS feeds`, right: true, why: "It says what the data shows and where it came from." },
          { text: `Satellites spy on ${ctx.name}`, right: false, why: "Catchy, but it tells readers nothing." },
        ], then: async () => { ctx.headline = `${fact}, per NASA and GDACS feeds`; return note("honest"); } } };
      },
    ],
    file: c => `Headline: ${c.headline}\nEvidence: ${c.events.length ? c.events.join("; ") : "no events listed"} (NASA EONET and GDACS, 30 days). ${n(c.rain, 0)} mm rain this week (Open-Meteo). Latest clear picture: ${c.scene || "none in 45 days"}.\nLimits: feeds list reported events only.`,
  },
];

// ---------- home and notebook ----------
function home() {
  resetMap(); run = null;
  map.flyTo({ center: [-40, 30], zoom: 1.3, duration: fade() * 3 });
  view.innerHTML = `<div class="intro"><h1>Solve real cases with pictures from space</h1>
    <p>Satellites photograph the whole planet every few days, and the pictures are free. Use them to answer real questions. No experience needed.</p></div>
    ${CASES.map((c, i) => {
      const open = i === 0 || c.id in save.stars || CASES[i - 1].id in save.stars;
      const fresh = open && !(c.id in save.stars) && (i === 0 || CASES[i - 1].id in save.stars);
      return `<button class="case" type="button" data-i="${i}" ${open ? "" : "disabled"}><span class="who">${fresh ? "Start here" : c.who}</span>
      <h3>${c.title}</h3><p>${open ? c.blurb : "Opens when you finish the case above."}</p>${open ? starRow(save.stars[c.id] || 0, c.maxStars) : ""}</button>`;
    }).join("")}`;
  view.querySelectorAll(".case:not([disabled])").forEach(b => (b.onclick = () => start(CASES[b.dataset.i])));
}
document.getElementById("home-btn").onclick = home;
document.getElementById("nb-btn").onclick = () => {
  document.getElementById("nb-body").innerHTML = `<h2>Notebook</h2><p>${save.notes.length} of 9 found. Solve cases to fill it.</p>` +
    Object.entries(NOTES).map(([k, [t, d, link]]) => save.notes.includes(k)
      ? `<div class="term"><h3>${t}</h3><p>${d}</p>${link ? `<a href="${link[1]}" target="_blank" rel="noopener">${link[0]}</a>` : ""}</div>`
      : `<div class="term locked">Not found yet</div>`).join("") +
    `<div class="row"><button class="btn" type="button" id="nb-close">Close</button></div>`;
  document.getElementById("nb-close").onclick = () => document.getElementById("nb").close();
  document.getElementById("nb").showModal();
};
countNotes();
home();
</script>
</body>
</html>
