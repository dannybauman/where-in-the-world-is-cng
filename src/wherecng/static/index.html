<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where in the world is Cloud-Native Geospatial?</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<a class="skip" href="#panel">Skip to the game</a>
<div class="app">
  <div class="map-wrap" role="region" aria-label="Map">
    <div id="map"></div>
    <div class="brand">
      <button class="logo" id="home-btn" type="button" aria-label="Where in the world is CNG? Home">Where in the world<span class="wide"> is CNG</span>?</button>
      <button id="nb-btn" type="button">Notebook <span id="nb-count"></span></button>
    </div>
    <div class="flip" id="flip" role="group" aria-label="Show picture">
      <button type="button" id="flip-a" aria-pressed="false">Before</button>
      <button type="button" id="flip-b" aria-pressed="true">After</button>
    </div>
  </div>
  <main id="panel" tabindex="-1"><div class="panel" id="view" aria-live="polite"></div></main>
</div>
<dialog id="nb"><div class="notebook" id="nb-body"></div></dialog>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
